<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Спасибо — SDS TEST</title>

<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#020403;
    --panel:rgba(255,255,255,.04);
    --panel-border:rgba(255,255,255,.08);
    --muted:#9fa6a3;
    --neon:#78f2b0;
    --neon2:#00ffa6;
  }

  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:#fff;
    overflow-x:hidden;
  }

  .bg-animation{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,255,150,.18), transparent 35%),
      radial-gradient(circle at 80% 70%, rgba(0,255,180,.14), transparent 40%),
      var(--bg);
  }

  .bg-animation::after{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
      repeating-linear-gradient(
        120deg,
        rgba(120,242,176,.05) 0px,
        rgba(120,242,176,.05) 1px,
        transparent 1px,
        transparent 90px
      );
    animation:gridMove 25s linear infinite;
  }

  @keyframes gridMove{
    0%{transform:translate(-10%,-10%)}
    100%{transform:translate(10%,10%)}
  }

  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 8%;
    box-sizing:border-box;
    text-align:center;
  }

  .glass{
    width:min(860px, 100%);
    background:var(--panel);
    backdrop-filter:blur(20px);
    border:1px solid var(--panel-border);
    border-radius:26px;
    padding:42px 32px;
    box-sizing:border-box;
  }

  .logo{
    height:70px;
    width:auto;
    margin:0 auto 16px;
    display:block;
    filter:drop-shadow(0 0 18px rgba(120,242,176,.28));
  }

  h1{
    margin:0 0 14px;
    font-size:34px;
    line-height:1.2;
    color:var(--neon);
    text-shadow:0 0 25px rgba(120,242,176,.6);
  }

  p{
    margin:0;
    color:rgba(255,255,255,.78);
    line-height:1.6;
    font-size:16px;
  }

  .btn{
    display:inline-block;
    margin-top:26px;
    padding:14px 28px;
    border-radius:40px;
    background:linear-gradient(135deg,var(--neon),var(--neon2));
    color:#021;
    font-weight:800;
    text-decoration:none;
    transition:.25s;
  }

  .btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 26px rgba(120,242,176,.55);
  }

  .links{
    margin-top:14px;
    font-size:13px;
    color:rgba(255,255,255,.65);
  }
  .links a{
    color:rgba(255,255,255,.72);
    text-decoration:none;
  }
  .links a:hover{ color:var(--neon); }

  @media(max-width:768px){
    .logo{ height:58px; }
    h1{ font-size:28px; }
    p{ font-size:15px; }
  }
</style>
</head>

<body>
<div class="bg-animation"></div>

<main class="wrap">
  <div class="glass">
    <img class="logo" src="logo.png" alt="Логотип SDS TEST" />
    <h1>Спасибо!</h1>
    <p>Заявка отправлена. Мы свяжемся с вами в ближайшее время.</p>

    <a class="btn" href="index.html">Вернуться на сайт</a>

  </div>
</main>

</body>
</html>
